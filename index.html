<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Narahari Shetty Lokesh</title>
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.18);
            --text-color: #ffffff;
            --accent-color: #00d2ff;
            --secondary-accent: #0072ff;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #050505;
            color: var(--text-color);
            overflow-x: hidden;
            position: relative;
        }

        /* Ambient Glow Background Spheres */
        .glow-sphere {
            position: fixed;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.35;
            z-index: 0;
            pointer-events: none;
        }
        .sphere-1 { top: -10%; left: -10%; width: 400px; height: 400px; background: #00d2ff; }
        .sphere-2 { top: 40%; right: -10%; width: 500px; height: 500px; background: #7928ca; }
        .sphere-3 { bottom: -10%; left: 20%; width: 450px; height: 450px; background: #0072ff; }

        /* Floating Bubbles */
        .bubble {
            position: absolute;
            bottom: -100px;
            background: radial-gradient(circle, rgba(0,210,255,0.4) 0%, rgba(0,0,0,0) 70%);
            border-radius: 50%;
            opacity: 0.6;
            animation: rise 12s infinite ease-in-out;
            pointer-events: none;
        }

        @keyframes rise {
            0% { transform: translateY(0) scale(1); opacity: 0; }
            50% { opacity: 0.7; }
            100% { transform: translateY(-110vh) scale(1.4); opacity: 0; }
        }

        .bubble:nth-child(1) { left: 15%; width: 100px; height: 100px; animation-duration: 10s; }
        .bubble:nth-child(2) { left: 35%; width: 70px; height: 70px; animation-duration: 15s; animation-delay: 3s; }
        .bubble:nth-child(3) { left: 55%; width: 120px; height: 120px; animation-duration: 12s; animation-delay: 1s; }
        .bubble:nth-child(4) { left: 75%; width: 90px; height: 90px; animation-duration: 14s; animation-delay: 5s; }
        .bubble:nth-child(5) { left: 85%; width: 60px; height: 60px; animation-duration: 18s; animation-delay: 2s; }

        .container {
            position: relative;
            z-index: 1;
            max-width: 1100px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 2px solid var(--glass-border);
            border-radius: 30px;
            padding: 40px;
            margin-bottom: 30px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9);
            transition: transform 0.3s ease, border-color 0.3s ease;
        }

        .glass-card:hover {
            border-color: rgba(0, 210, 255, 0.4);
        }

        /* Hero Header split layout */
        header.glass-card {
            background: linear-gradient(135deg, rgba(255,255,255,0.12), rgba(255,255,255,0.02));
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            gap: 30px;
            align-items: center;
        }

        h1 {
            font-size: 3.2rem;
            margin: 0 0 10px 0;
            background: linear-gradient(90deg, #ffffff, var(--accent-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
            font-weight: 700;
        }

        .title-job {
            font-size: 1.3rem;
            color: var(--accent-color);
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 25px;
            font-weight: 600;
        }

            display: flex;
            gap: 12px;
            font-size: 0.95rem;
            color
